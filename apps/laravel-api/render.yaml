services:
  - type: web
    name: commercebridge-api
    env: php
    runtimeVersion: 8.2
    buildCommand: |
      composer install --optimize-autoloader --no-dev
      php artisan key:generate
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: commercebridge-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: commercebridge-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: commercebridge-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: commercebridge-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: commercebridge-db
          property: password
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_DRIVER
        value: file
      - key: SANCTUM_STATEFUL_DOMAINS
        value: commercebridge-frontend.vercel.app
      - key: SESSION_DOMAIN
        value: .vercel.app

databases:
  - name: commercebridge-db
    databaseName: commercebridge
    user: commercebridge_user
